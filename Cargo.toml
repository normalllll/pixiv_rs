[package]
name = "pixiv_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["test-util", "full"] }
tokio-util = "0.7.18"
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "form", "query"] }
base64 = "0.22.1"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
url = "2.5"
async-stream = "0.3.6"
futures-core = "0.3.32"
